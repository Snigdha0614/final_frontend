# Production Nginx Reverse Proxy Configuration for TalentTrade
# Routes all client pages and API requests through a single domain (e.g. https://mywebsite.com)

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    upstream backend_upstream {
        server backend:8085;
        keepalive 32;
    }

    server {
        listen 80;
        server_name mywebsite.com www.mywebsite.com localhost;

        # 1. API Reverse Proxy
        location /api/ {
            proxy_pass http://backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            client_max_body_size 25M;
        }

        # 2. Uploaded media files
        location /uploads/ {
            proxy_pass http://backend_upstream;
            proxy_set_header Host $host;
            client_max_body_size 25M;
        }

        # 3. Static Frontend SPA
        location / {
            root /usr/share/nginx/html;
            index index.html index.htm;
            try_files $uri $uri/ /index.html;
        }
    }
}
