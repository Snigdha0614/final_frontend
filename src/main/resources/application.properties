```properties
# Application Configuration
spring.application.name=talenttrade-backend
server.port=${PORT:8085}

# Database Configuration - Aiven MySQL
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=true

# File Uploads
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB
talenttrade.upload.dir=./uploads

# JWT Security
talenttrade.jwt.secret=${JWT_SECRET}
talenttrade.jwt.expiration-ms=86400000

# CORS
talenttrade.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:3000}
```
